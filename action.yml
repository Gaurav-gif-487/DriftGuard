name: "driftguard"
description: >-
  Zero-execution static analysis for breaking API driftguard between a
  frontend and backend repo. Fails the check when a client call-site no
  longer matches what the server actually returns.
branding:
  icon: "git-pull-request"
  color: "purple"

inputs:
  client:
    description: "Path to the client/frontend root (relative to the repo root)."
    required: true
  server:
    description: "Path to the server/backend root (relative to the repo root)."
    required: true
  threshold:
    description: "Minimum confidence (0..1) for fuzzy dynamic-route resolution."
    required: false
    default: "0.6"
  strict:
    description: "Fail the job even when only unresolved routes are found (no true violations)."
    required: false
    default: "false"
  comment-pr:
    description: "Post/update a PR comment with the markdown report when running on a pull_request event."
    required: false
    default: "true"
  upload-sarif:
    description: "Upload a SARIF report to GitHub code scanning."
    required: false
    default: "true"
  impact-comment:
    description: >-
      Opt-in: post the impact report generated by `driftguard check`.
      The report includes dependency paths and proof levels. Default is
      "false"; the standard violation report remains unchanged.
    required: false
    default: "false"
  base:
    description: >-
      Git ref to diff against when impact-comment is "true". Defaults to the
      pull request's base commit. Ignored outside pull_request events or when
      impact-comment is "false".
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  github-token:
    description: "Token used to post/update the PR comment. Defaults to the workflow's GITHUB_TOKEN."
    required: false
    default: ${{ github.token }}

outputs:
  exit-code:
    description: "Exit code from driftguard (0 = clean, 1 = drift found)."
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install driftguard
      shell: bash
      run: npm install --no-save driftguard@latest

    - name: Run driftguard (SARIF)
      id: run
      shell: bash
      run: |
        set +e
        npx driftguard \
          --client="${{ inputs.client }}" \
          --server="${{ inputs.server }}" \
          --threshold="${{ inputs.threshold }}" \
          $( [ "${{ inputs.strict }}" = "true" ] && echo --strict ) \
          --format=sarif --out=driftguard.sarif
        code=$?
        npx driftguard \
          --client="${{ inputs.client }}" \
          --server="${{ inputs.server }}" \
          --threshold="${{ inputs.threshold }}" \
          --format=markdown --out=driftguard.md
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        exit 0

    # Fetch the baseline ref when impact reporting is enabled. GitHub-hosted
    # runners may use a shallow checkout that does not contain the base commit.
    - name: Fetch baseline ref for impact comment
      if: inputs.impact-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      run: git fetch --no-tags --depth=1 origin "${{ inputs.base }}" || true

    - name: Run driftguard check (impact comment)
      if: inputs.impact-comment == 'true' && github.event_name == 'pull_request'
      shell: bash
      run: |
        set +e
        npx driftguard check \
          --client="${{ inputs.client }}" \
          --server="${{ inputs.server }}" \
          --threshold="${{ inputs.threshold }}" \
          --base="${{ inputs.base }}" \
          --format=markdown --out=driftguard-impact.md
        exit 0

    - name: Upload SARIF to code scanning
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: driftguard.sarif

    - name: Comment on PR
      if: inputs.comment-pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');

          // Use the impact report when available; otherwise use the standard report.
          let body, marker;
          const impactPath = 'driftguard-impact.md';
          if ('${{ inputs.impact-comment }}' === 'true' && fs.existsSync(impactPath) && fs.statSync(impactPath).size > 0) {
            body = fs.readFileSync(impactPath, 'utf8');
            marker = '<!-- driftguard-impact-report -->';
          } else {
            body = fs.readFileSync('driftguard.md', 'utf8');
            marker = '<!-- driftguard-report -->';
          }

          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;

          const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.data.find((c) => c.body.includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Fail if breaking drift was found
      shell: bash
      run: exit ${{ steps.run.outputs.exit-code }}

name: contract-drift example

on:
  workflow_dispatch:
  push:
    paths:
      - "fixtures/**"
      - "src/**"
      - "test/**"
      - "action.yml"

permissions:
  contents: read
  security-events: write

jobs:
  analyze-fixtures:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Analyze fixtures
        run: node bin/contract-drift.mjs --demo --format=sarif --out=contract-drift.sarif

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: contract-drift.sarif
